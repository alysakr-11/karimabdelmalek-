name: Deploy to GitHub Pages

# Pages serves files and nothing else, so this builds the static export rather
# than the server build: no image optimiser, no redirects, and everything
# living under /<repo>/ instead of the domain root.
#
# Manual only. The site is deployed from a host that runs the server build,
# where the export is not wanted; and this workflow cannot succeed until Pages
# is switched on for the repository (Settings -> Pages -> Source: GitHub
# Actions), so running it on every push would just redden the branch. Run it
# from the Actions tab when a static copy is actually needed.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static export
        env:
          PAGES_EXPORT: '1'
          # Both are the sub-path Pages serves from: the first is Next's own
          # basePath, the second is what src/content/site.ts prefixes media
          # URLs with, which Next does not do for an unoptimised <Image>.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Shrink images and fix font URLs
        run: node scripts/prepare-export.mjs out /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
